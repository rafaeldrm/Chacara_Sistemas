;=== ESP12-E (AI-Thinker ESP-8266MOD) ===
[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino

;=== SERIAL ===
monitor_speed = 115200
upload_speed = 115200

;=== BIBLIOTECAS ===
lib_deps =
    knolleary/PubSubClient

build_flags = 
	-I include 

lib_extra_dirs = 
		C:/Users/Rafaeldrm/Desktop/ARDUINO_CHACARA_SISTEMAS/Protocolo_Chacara/lib	

monitor_filters = direct
lib_ldf_mode = deep+	
extra_scripts =  pre:C:/Users/Rafaeldrm/Desktop/ARDUINO_CHACARA_SISTEMAS/Protocolo_Chacara/Scripts/contador_upload.py