[env:due]
platform = atmelsam
board = due
framework = arduino
monitor_speed = 115200
build_flags = 
	-I include
lib_extra_dirs = 
	E:\ARDUINO_CHACARA_SISTEMAS\Protocolo_Chacara\lib
monitor_filters = direct
lib_ldf_mode = deep+
lib_deps = 
	sandeepmistry/LoRa@^0.8.0
	hasenradball/DS3231-RTC@^2.0.0
	dfrobot/DFRobotDFPlayerMini@^1.0.6
extra_scripts = pre:E:/ARDUINO_CHACARA_SISTEMAS/Protocolo_Chacara/Scripts/contador_upload.py
