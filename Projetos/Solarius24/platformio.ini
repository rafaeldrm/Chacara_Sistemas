; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags = 
	-I include

	
lib_extra_dirs = 
		E:\ARDUINO_CHACARA_SISTEMAS\Protocolo_Chacara\lib
		

monitor_filters = direct
lib_ldf_mode = deep+
lib_deps = 
	arduino-libraries/Servo@^1.3.0
	sandeepmistry/LoRa@^0.8.0
	adafruit/Adafruit GFX Library@^1.12.5
	adafruit/Adafruit SSD1306@^2.5.16


extra_scripts =  pre:E:/ARDUINO_CHACARA_SISTEMAS/Protocolo_Chacara/Scripts/contador_upload.py